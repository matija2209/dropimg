services:
  dropimg:
    build: .
    container_name: dropimg
    restart: unless-stopped
    ports:
      - "${APP_PORT:-12312}:3000"
    environment:
      # General settings
      APP_NAME: "${APP_NAME:-DropImg}"
      VITE_APP_NAME: "${APP_NAME:-DropImg}"
      APP_URL: "${APP_URL:-http://localhost:12312}"
      PUBLIC_BASE_URL: "${APP_URL:-http://localhost:12312}"
      DATABASE_URL: "file:/data/app.sqlite"
      
      # Storage settings (local or s3)
      STORAGE_DRIVER: "s3"
      UPLOAD_DIR: "/data/uploads"
      
      # Limits and security
      MAX_UPLOAD_MB: "20"
      ALLOWED_TYPES: "image/png,image/jpeg,image/webp,image/gif"
      PUBLIC_UPLOADS: "false"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-change-me}"
      
      # S3 configuration (Defaulting to internal Garage service)
      S3_ENDPOINT: "http://garage:3900"
      S3_BUCKET: "dropimg"
      S3_REGION: "garage"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-GKb5db65b57d7d0799c680ee25}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-f9f9af94d42a9c6ec5c20db92aec602e5ef43b5de9e98a4e22b94a2f41f0c994}"
      S3_FORCE_PATH_STYLE: "true"
      
    volumes:
      - ./data:/data
    depends_on:
      - garage

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: garage
    restart: unless-stopped
    entrypoint: ["/garage"]
    command: ["server"]
    ports:
      - "3900:3900"
      - "127.0.0.1:3903:3903"
    volumes:
      - ./docker/garage/config/garage.toml:/etc/garage.toml:ro
      - ./docker/garage/data/meta:/var/lib/garage/meta
      - ./docker/garage/data/data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: dropimg-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --config /etc/cloudflared/config.yaml run
    depends_on:
      - dropimg
    volumes:
      - ./cloudflared-config.yaml:/etc/cloudflared/config.yaml:ro
      - ./9e396975-99a6-4af3-9e4a-e4aff1bb50f8.json:/etc/cloudflared/credentials.json:ro
