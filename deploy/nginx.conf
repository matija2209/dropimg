upstream dropimg_api {
    server dropimg:3000;
}

upstream dropimg_uploader {
    server uploader:8080;
}

# Preserve HTTPS from whcp-dev-proxy / Cloudflare (this nginx listens on :80 only).
map $http_x_forwarded_proto $dropimg_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    client_max_body_size 0;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;

    location = /api/internal/media-finalized {
        return 404;
    }

    location /api/upload/chunked/ {
        proxy_pass http://dropimg_uploader;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dropimg_forwarded_proto;
    }

    location / {
        proxy_pass http://dropimg_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dropimg_forwarded_proto;
    }
}
